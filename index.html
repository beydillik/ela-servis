<!doctype html>
<html lang="tr" data-theme="gece">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1513">
<title>Ela Servis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<script>
  // Seçili temayı sayfa çizilmeden önce uygula (açılışta renk "sıçraması" olmasın)
  try { const t = localStorage.getItem("ela.theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch {}
</script>
<style>
  /* ===================================================================
     TEMALAR — 3 koyu + 1 açık. Tüm yazı/zemin çiftleri en az 4.5:1
     kontrastlı (gün ışığında okunurluk için çoğu 7:1 üstü).
     =================================================================== */
  :root, [data-theme="gece"] {          /* Gece — antrasit + yeşil (varsayılan) */
    --bg: #0f1513; --bg2: #16201c; --card: #1a2420; --line: #2c3a34;
    --ink: #f2f6f4; --muted: #b3c0ba; --accent: #f5b942;
    --gate: #1d4ed8; --gate-ink: #ffffff;
    --wa: #15803d; --wa-ink: #ffffff;
    --done: #233029; --done-ink: #d6f5e1; --done-mark: #4ade80;
  }
  [data-theme="lacivert"] {             /* Lacivert — gece mavisi + altın */
    --bg: #0b1222; --bg2: #121c33; --card: #16223d; --line: #2a3a5e;
    --ink: #f3f6fc; --muted: #b6c2dc; --accent: #fbbf24;
    --gate: #2563eb; --gate-ink: #ffffff;
    --wa: #047857; --wa-ink: #ffffff;
    --done: #1c2a47; --done-ink: #d3f3e6; --done-mark: #34d399;
  }
  [data-theme="grafit"] {               /* Grafit — saf siyah, en yüksek kontrast */
    --bg: #000000; --bg2: #0d0d0d; --card: #121212; --line: #3a3a3a;
    --ink: #ffffff; --muted: #c9c9c9; --accent: #ffd60a;
    --gate: #1e40af; --gate-ink: #ffffff;
    --wa: #166534; --wa-ink: #ffffff;
    --done: #1f1f1f; --done-ink: #e6ffe9; --done-mark: #5eea8a;
  }
  [data-theme="gunduz"] {               /* Gündüz — güneş altında okunur açık tema */
    --bg: #eef1ee; --bg2: #e2e8e3; --card: #ffffff; --line: #c9d3cc;
    --ink: #0d1411; --muted: #3f4c46; --accent: #b45309;
    --gate: #1d4ed8; --gate-ink: #ffffff;
    --wa: #15803d; --wa-ink: #ffffff;
    --done: #e3efe7; --done-ink: #14532d; --done-mark: #15803d;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--ink); background: var(--bg); }
  body {
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 60% at 50% 0%, var(--bg2) 0%, var(--bg) 60%) fixed;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: 100%; max-width: 440px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .hidden { display: none !important; }
  svg { flex: none; }

  /* Üst bölüm */
  header { display: flex; align-items: center; gap: 14px; }
  .logo { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; flex: none;
          background: var(--card); border: 1px solid var(--line); color: var(--accent); }
  .logo svg { width: 30px; height: 30px; }
  .title { flex: 1; min-width: 0; }
  h1 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: -.01em; }
  #clock { color: var(--muted); font-size: 15px; font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .theme-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
               color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
  .theme-btn svg { width: 22px; height: 22px; }

  /* Butonlar */
  .btn {
    position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px;
    padding: 14px 18px 14px 14px; border: 0; border-radius: 20px; cursor: pointer; text-align: left;
    font: inherit; font-size: 20px; font-weight: 750; letter-spacing: -.005em;
    box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 10px 24px -12px rgba(0,0,0,.65);
    transition: transform .08s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.975); filter: brightness(.95); }
  .btn .chip { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none;
               background: rgba(255,255,255,.18); }
  .btn .chip svg { width: 26px; height: 26px; }
  .btn .txt { flex: 1; display: flex; flex-direction: column; line-height: 1.2; }
  .btn .txt small { font-size: 15px; font-weight: 500; opacity: .9; margin-top: 3px; }
  .btn .arrow { opacity: .75; }
  .btn .arrow svg { width: 22px; height: 22px; }

  .btn-gate { background: var(--gate); color: var(--gate-ink); }
  .btn-wa { background: var(--wa); color: var(--wa-ink); }
  .btn-wa.sent { background: var(--done); color: var(--done-ink); box-shadow: inset 0 0 0 2px var(--done-mark); }
  .btn-wa.sent .chip { background: var(--done-mark); color: var(--done); }

  /* Kart */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 18px; display: grid; gap: 12px;
          box-shadow: 0 20px 40px -28px rgba(0,0,0,.7); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 2px 4px 4px; }
  .card-head .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none;
                    box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); }
  .card-head h2 { margin: 0; font-size: 21px; font-weight: 800; }
  .card-head p { margin: 2px 0 0; color: var(--muted); font-size: 16px; font-weight: 500; }

  /* Arama butonları (yan yana, çerçeveli — WhatsApp'tan ikincil görünür) */
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; font-weight: 600; margin: 4px 2px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .calls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-call { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 60px; padding: 10px;
              border-radius: 16px; cursor: pointer; font: inherit; font-size: 18px; font-weight: 750;
              background: var(--bg); color: var(--ink); border: 2px solid var(--line); transition: transform .08s ease; }
  .btn-call svg { width: 22px; height: 22px; color: var(--done-mark); }
  .btn-call:active { transform: scale(.97); border-color: var(--done-mark); }

  .step { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 4px -12px; }

  /* Tema seçici */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 5; }
  .sheet { width: 100%; max-width: 440px; background: var(--card); color: var(--ink); border: 1px solid var(--line);
           border-radius: 24px 24px 0 0; padding: 18px 16px max(22px, env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 4px 14px; font-size: 18px; }
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .theme-opt { border: 2px solid var(--line); border-radius: 16px; padding: 10px; cursor: pointer; font: inherit; font-weight: 700;
               display: grid; gap: 8px; text-align: left; }
  .theme-opt[aria-pressed="true"] { border-color: var(--accent); }
  .swatch { height: 46px; border-radius: 10px; display: flex; gap: 6px; align-items: flex-end; padding: 7px; }
  .swatch i { width: 22px; height: 14px; border-radius: 4px; display: block; }

  #setup h1 { font-size: 23px; }
  #setup p { color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-size: 16px; font-weight: 600;
           max-width: calc(100% - 32px); text-align: center; z-index: 9; }
</style>
</head>
<body>
<!-- Kurulum linkiyle açılmadıysa gösterilir -->
<main id="setup" class="hidden">
  <h1>Kurulum linki gerekli</h1>
  <p>Bu sayfa, size WhatsApp'tan gönderilen özel linkle bir kez açılmalı. Linke tekrar dokunun.</p>
</main>

<main id="app" class="hidden">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18v2M16 18v2"/><circle cx="8" cy="14.5" r=".7" fill="currentColor"/><circle cx="16" cy="14.5" r=".7" fill="currentColor"/></svg>
    </div>
    <div class="title">
      <h1>Ela Beydilli</h1>
      <div id="clock"></div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Tema seç">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 3a9 9 0 0 1 0 18" fill="currentColor"/></svg>
    </button>
  </header>

  <!-- 1. adım: site kapısı -->
  <div class="step">1 · Giriş</div>
  <button class="btn btn-gate" id="gateBtn" type="button">
    <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17"/><circle cx="15" cy="12" r="1.1" fill="currentColor"/></svg></span>
    <span class="txt">Royal Garden Kapı Aç<small>Kapıyı arar</small></span>
    <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
  </button>

  <!-- 2. adım: aileye haber -->
  <div class="step">2 · Teslim</div>
  <section class="card">
    <div class="card-head">
      <span class="dot"></span>
      <div><h2>🏠 Ela eve bırakıldı</h2><p>Baba ve/veya anneye haber ver</p></div>
    </div>
    <button class="btn btn-wa" data-who="baba" type="button"></button>
    <button class="btn btn-wa" data-who="anne" type="button"></button>

    <!-- Evdeyse: arama butonları -->
    <div class="divider"><span>Evdeyseniz arayın</span></div>
    <div class="calls">
      <button class="btn-call" data-call="baba" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        Babayı Ara
      </button>
      <button class="btn-call" data-call="anne" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        Anneyi Ara
      </button>
    </div>
  </section>
</main>

<!-- Tema seçim paneli -->
<div class="sheet-bg hidden" id="sheet">
  <div class="sheet" role="dialog" aria-label="Tema">
    <h3>Tema</h3>
    <div class="themes" id="themes"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
// =====================================================================
// Ela Servis — servis şoförü için tek sayfalık uygulama
// - Numaralar kodda DEĞİL: ilk açılışta linkin # kısmından okunur ve
//   bu telefona kaydedilir. (# sonrası sunucuya gönderilmez.)
//   Örnek: .../#baba=905XXXXXXXXX&anne=905XXXXXXXXX&kapi=905XXXXXXXXX
// - "Haber ver" butonları WhatsApp'ı mesaj hazır şekilde açar.
// - "Gönderildi" işareti sadece bu oturumda ve 10 dakika görünür;
//   uygulama kapatılıp açılınca butonlar varsayılana döner.
// =====================================================================
const $ = (id) => document.getElementById(id);
const store = {       // kalıcı (numaralar, tema)
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const session = {     // geçici (uygulama kapanınca silinir)
  get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const SENT_TTL_MS = 10 * 60 * 1000; // "gönderildi" işaretinin süresi
let sentMemory = {};                // sessionStorage çalışmazsa yedek

const PEOPLE = {
  baba: { label: "Babaya Haber Ver", done: "Babaya gönderildi" },
  anne: { label: "Anneye Haber Ver", done: "Anneye gönderildi" },
};

const THEMES = {
  gece:     { name: "Gece",     color: "#0f1513", sw: ["#15803d", "#1d4ed8", "#f5b942"] },
  lacivert: { name: "Lacivert", color: "#0b1222", sw: ["#047857", "#2563eb", "#fbbf24"] },
  grafit:   { name: "Grafit",   color: "#000000", sw: ["#166534", "#1e40af", "#ffd60a"] },
  gunduz:   { name: "Gündüz",   color: "#eef1ee", sw: ["#15803d", "#1d4ed8", "#b45309"] },
};

// --- 1) Linkteki numaraları al, kaydet, adres çubuğundan temizle ---
function readSetupFromHash() {
  if (!location.hash) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const clean = (v) => (v || "").replace(/\D/g, ""); // sadece rakam
  const nums = { baba: clean(p.get("baba")), anne: clean(p.get("anne")), kapi: clean(p.get("kapi")) };
  if (nums.baba || nums.anne || nums.kapi) {
    store.set("ela.nums", { ...(store.get("ela.nums") || {}), ...Object.fromEntries(Object.entries(nums).filter(([, v]) => v)) });
  }
  history.replaceState(null, "", location.pathname); // # kısmını sil
}

// --- Yardımcılar ---
const pad = (n) => String(n).padStart(2, "0");
const fmtTime = (ts) => { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 2600);
}

// Son 10 dk içinde bu oturumda kime gönderildi: { baba: 1696..., anne: ... }
function recentSent() {
  const all = { ...sentMemory, ...(session.get("ela.sent") || {}) };
  const now = Date.now();
  return Object.fromEntries(Object.entries(all).filter(([, ts]) => now - ts < SENT_TTL_MS));
}

const ICON = {
  wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
};

function renderButtons() {
  const sent = recentSent();
  document.querySelectorAll(".btn-wa").forEach((b) => {
    const who = b.dataset.who;
    if (sent[who]) {
      b.classList.add("sent");
      b.innerHTML = `<span class="chip">${ICON.check}</span>
        <span class="txt">${PEOPLE[who].done}<small>Saat ${fmtTime(sent[who])} · tekrar için dokunun</small></span>`;
    } else {
      b.classList.remove("sent");
      b.innerHTML = `<span class="chip">${ICON.wa}</span>
        <span class="txt">${PEOPLE[who].label}<small>WhatsApp ile</small></span><span class="arrow">${ICON.arrow}</span>`;
    }
  });
}

// --- 2) Butonlar ---
function notify(who) {
  const nums = store.get("ela.nums") || {};
  if (!nums[who]) return toast("Bu kişinin numarası kayıtlı değil");
  const now = Date.now();
  const text = `🏠 Ela eve bırakıldı (${fmtTime(now)}) – Emre Kılıç`;
  // Gönderimi bu oturum için işaretle (WhatsApp'a geçmeden önce)
  sentMemory[who] = now;
  session.set("ela.sent", { ...(session.get("ela.sent") || {}), [who]: now });
  renderButtons();
  // WhatsApp'ı mesaj hazır şekilde aç (resmi wa.me linki)
  location.href = `https://wa.me/${nums[who]}?text=${encodeURIComponent(text)}`;
}

function openGate() {
  const nums = store.get("ela.nums") || {};
  if (!nums.kapi) return toast("Kapı numarası kayıtlı değil");
  location.href = `tel:+${nums.kapi}`; // tuş ekranı açılır, "Ara"ya basılır
}

// Babayı / Anneyi ara — tuş ekranı numara yazılı açılır, "Ara"ya basılır
function callPerson(who) {
  const nums = store.get("ela.nums") || {};
  if (!nums[who]) return toast("Bu kişinin numarası kayıtlı değil");
  location.href = `tel:+${nums[who]}`;
}

document.querySelectorAll(".btn-wa").forEach((b) => b.addEventListener("click", () => notify(b.dataset.who)));
document.querySelectorAll(".btn-call").forEach((b) => b.addEventListener("click", () => callPerson(b.dataset.call)));
$("gateBtn").addEventListener("click", openGate);

// --- 3) Tema ---
function applyTheme(key) {
  if (!THEMES[key]) key = "gece";
  document.documentElement.dataset.theme = key;
  document.querySelector('meta[name="theme-color"]').content = THEMES[key].color;
  store.set("ela.theme", key);
  document.querySelectorAll(".theme-opt").forEach((o) => o.setAttribute("aria-pressed", String(o.dataset.key === key)));
}

function buildThemePicker() {
  $("themes").innerHTML = Object.entries(THEMES).map(([key, t]) => `
    <button class="theme-opt" data-key="${key}" type="button" style="background:${t.color};color:${key === "gunduz" ? "#0d1411" : "#ffffff"}">
      <span class="swatch" style="background:${t.color};box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)">
        ${t.sw.map((c) => `<i style="background:${c}"></i>`).join("")}
      </span>${t.name}
    </button>`).join("");
  $("themes").querySelectorAll(".theme-opt").forEach((o) =>
    o.addEventListener("click", () => { applyTheme(o.dataset.key); $("sheet").classList.add("hidden"); }));
}
$("themeBtn").addEventListener("click", () => $("sheet").classList.remove("hidden"));
$("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("sheet").classList.add("hidden"); });

// Saat göstergesi
function tick() {
  $("clock").textContent = new Date().toLocaleString("tr-TR", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
}

// Uygulamaya geri dönülünce (örn. WhatsApp'tan) ekranı tazele; 10 dk geçtiyse işaretler kalkar
document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderButtons(); tick(); } });

// --- Başlangıç ---
readSetupFromHash();
buildThemePicker();
applyTheme(store.get("ela.theme") || "gece");
const nums = store.get("ela.nums");
if (!nums || !(nums.baba || nums.anne)) {
  $("setup").classList.remove("hidden");
} else {
  $("app").classList.remove("hidden");
  renderButtons(); tick();
  setInterval(() => { tick(); renderButtons(); }, 30_000);
}

// Çevrimdışı açılabilmesi için service worker
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
